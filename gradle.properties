android.useAndroidX=true
kotlin.code.style=official
# R8 heap: 4096m OOM-killed the build 3x on this 6GB box (batch 107: daemon 4096 + Kotlin 1152 + hatch ~350 + a parallel chat's Java tips the 6GB cell over during minifyGithubReleaseWithR8). 2048m is the lean value that built batches <=105.
org.gradle.jvmargs=-Djava.net.preferIPv4Stack=true -Xmx4096m -XX:MaxMetaspaceSize=576m -Dfile.encoding=UTF-8
# Kotlin daemon capped: 4096m here + 4096m Gradle daemon = 8GB headroom vs the 6GB cgroup,
# and the daemon was OOM-killed twice mid-R8 on batch 107 (2026-11-16). 1152m is the proven value.
kotlin.daemon.jvmargs=-Xmx1152m -XX:MaxMetaspaceSize=384m
org.gradle.workers.max=4
org.gradle.caching=true
org.gradle.configuration-cache=true

# The version the next release will carry; nightly builds are named <this>-nightly.<run>+<sha>.
glidetube.nightlyBaseVersion=3.0.0

kotlin.compiler.execution.strategy=in-process
