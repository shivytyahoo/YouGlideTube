name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPECTED_SIGNER_SHA256: ba657a2bf06ca57003f323a14e6bba11dcea69bda436098f4cd77ce51992a048

jobs:
  build:
    name: Verify and build universal APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # Spotless ratchet needs the ratchet commit in history; a shallow
          # clone does not contain it, so fetch the full history.
            fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Release signing key is missing; refusing to publish an unsigned APK."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Check formatting, tests, lint and build
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew -Dorg.gradle.jvmargs="-Xmx8g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true" spotlessCheck testDebugUnitTest compileDebugAndroidTestKotlin lintRelease assembleRelease --stacktrace

      # The log only prints a test failure's one-liner; the full stack trace lives in the
      # test report XMLs. Upload them when the build fails so a failure can be diagnosed
      # from the run instead of guessed at.
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: warn
      - name: Verify release signing certificate
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          apksigner=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          actual=$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          if [ "$actual" != "$EXPECTED_SIGNER_SHA256" ]; then
            echo "::error::APK signing certificate '$actual' does not match the official release key."
            exit 1
          fi

      - name: Name universal APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/YouGlideTube.apk
          sha256sum dist/YouGlideTube.apk > dist/checksums.txt

      - name: Upload universal APK artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: YouGlideTube-universal-apk
          path: dist/*
          if-no-files-found: error

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="app/src/main/assets/changelog/v$version.txt"
          if [ ! -f "$notes" ]; then
            echo "::error::Changelog asset $notes is missing; refusing to publish an empty release."
            exit 1
          fi
          {
            echo "## What's new in $version"
            echo
            sed -e '/^VERSION:/d' -e '/^DATE:/d' -e 's/^• /- /' "$notes"
            echo
            prev="$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || true)"
            if [ -n "$prev" ]; then
              echo "Universal APK — one file for every device · installs over ${prev#v} · Android 8.0 (API 26) or newer"
            else
              echo "Universal APK — one file for every device · Android 8.0 (API 26) or newer"
            fi
          } > dist/release-notes.md

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/YouGlideTube.apk
            dist/checksums.txt
          body_path: dist/release-notes.md
